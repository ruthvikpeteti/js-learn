<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html Events </title>
</head>
<body style="background-color: #414141; color: aliceblue;">
    <h2>Amazing Image</h2>
    <div >
        <ul id="images">
            <li><img width="200px" id="photoshop" src="https://images.pexels.com/photos/3561339/pexels-photo-3561339.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt="photoshop"></li>
            <li><img width="200px" id="japan" src="https://images.pexels.com/photos/3532553/pexels-photo-3532553.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><img width="200px" id="river" src="https://images.pexels.com/photos/3532551/pexels-photo-3532551.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><img width="200px" id="owl" src="https://images.pexels.com/photos/3532552/pexels-photo-3532552.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt="" ></li>
            <li><img width="200px" id="prayer" src="https://images.pexels.com/photos/2522671/pexels-photo-2522671.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><a style="color: aliceblue;" href="https://google.com" id="google">Google</a></li>
        </ul>
   </div>
</body>
<script>
    // document.getElementById('owl').onclick=function(){
    //     alert('This is an owl');
    // }       

    document.getElementById('owl').addEventListener('click', function(e){// this the best approach to find an occurance event
        console.log(e)
        //alert('This is an owl');
    })// it is used for eg type, timestamp, defaultPrevented, target, toElement, srcElement, currentTarget(*learn atlest these)
    //clientx, clienty,screenx,screeny
    //coordinates, altKey, shiftkey, keycode
    /
    document.getElementById('images').addEventListener('click', function(e){
        console.log("clicked inside the ul")
    },false)
    document.getElementById('owl').addEventListener('click', function(e){
        console.log("clicked owl")
        //e.stopPropagation()// it stops the event form propogating after this.
    },false)
    // The third parameter (true/false) controls event propagation.
    // If false (default), the event follows bubbling: inner element runs first, then outer.
    // If true, the event follows capturing: outer element runs first, then inner.
    //in this perticular example the li tag in ehich the image exists is inside the ul tag iff the ul tag of if i click an element of il tag then functions ofboth li and ul must occur, the true/false specify in ehich direction the propogation happenes if its fale(default) then inside out happens the li function will run before the ul function is true then opposite happenes

    document.getElementById('google').addEventListener('click',function(e){
        e.preventDefault()//stops the browser’s default behavior for an event
        e.stopPropagation()
        console.log("google clicked")
    },false)

    document.querySelector('#images').addEventListener('click',function(e){
        console.log(e.target)
        console.log(e.target.parentNode)
        // if (e.target.tagName === 'IMG')
        //     {
        //         console.log(e.target.id)
        //         let removeIt = e.target.parentNode
        //         removeIt.remove()
        //     }
        let removeIt = e.target.parentNode
        removeIt.remove()
    },false) 
</script>
</html>
