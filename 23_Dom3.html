<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Practice 3</title>
</head>
<body style="background-color:black; color:white">
    
</body>
<script>
    const div = document.createElement('div')
    console.log(div)
    div.className="main"
    div.innerText = "I am a new div"
    div.setAttribute('id', 'main-div')
    div.style.backgroundColor='green'
    div.style.padding='12px'
    document.body.appendChild(div)//finally adds a element from memory to document.


</script>
</html>
