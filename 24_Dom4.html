<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Practice 4</title>
</head>
<body style="background-color:black; color:white">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
</body>
<script>
    function addLanguage(langName){
        const li = document.createElement('li')
        li.innerHTML= `${langName}`
        document.querySelector('.language').appendChild(li)
    }
    addLanguage('Python')

    function addOptiLanguage(langName){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOptiLanguage('C++')

    //Edit
    const secondLang = document.querySelector("li:nth-child(2)")// in this child starts from 1 not 0
    //secondLang.innerHTML= "MOJO"
    const newli = document.createElement('li')// in this 
    newli.textContent = "MOJO"
    secondLang.replaceWith(newli)// it replace the previous element with newli

    //Edit
    const firstLang = document.querySelector("li:first-child")//selects the first child
    firstLang.outerHTML = "<li>TypeScript</li>"//selects

    //Remove
    const lastLang = document.querySelector("li:last-child")
    lastLang.remove()
</script>
</html>
