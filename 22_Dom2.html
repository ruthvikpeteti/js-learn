<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Practice 2</title>
</head>
<body style="background-color:green; color:white">
    <div class="parent">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
    </div>
</body>
<script>
    const parent = document.querySelector('.parent')
    console.log(parent)
    console.log(parent.children)//will return a HTMLCollection of children
    console.log(parent.children[0])//INdex still work on HTMLCOollection
    console.log(parent.children[0].innerText)
    for(let i=0; i<parent.children.length; i++){//For-loop does work on HTMLCollection
       console.log(parent.children[i].innerHTML)
    }
    parent.children[1].style.color = 'orange'
    console.log(parent.firstElementChild)//Returns the innerHTML of Monday
    console.log(parent.lastElementChild)//Returns the innerHTML of Thursday

    const dayOne = document.querySelector('.day')//select first day
    console.log(dayOne)
    console.log(dayOne.parentElement)//easier and faster way to go back to the parent
    console.log(dayOne.nextElementSibling)//next child in the list will be selected
    console.log("Nodes:", parent.childNodes)//when seen in the console in web we will see 9 elements the nodelist as there are 4 elements and there are 5 line breaks surrounding them. browser only count the first line break eve if there are 5 line breaks it will only show 1
</script>


</html>
